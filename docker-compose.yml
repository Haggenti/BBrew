services:
  bbrew:
    image: bbrew:local
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    environment:
      BBREW_DATA_DIR: /data
      DJANGO_DEBUG: "0"
      DJANGO_SECRET_KEY: "REPLACE_WITH_A_RANDOM_SECRET_BEFORE_FIRST_START"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,192.168.1.105"
      DJANGO_CSRF_TRUSTED_ORIGINS: "http://192.168.1.105:8086"
      DJANGO_SECURE_COOKIES: "0"
      DJANGO_SECURE_PROXY_SSL_HEADER: "0"
    ports:
      - "192.168.1.105:8086:8000"
    volumes:
      - ./data:/data
    security_opt:
      - no-new-privileges:true
