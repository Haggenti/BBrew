{% load static %}
<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}BBS — Brewing Brain System{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
</head>
<body class="bg-light">
  <aside class="app-sidebar" id="app-sidebar">
    <div class="sidebar-header">
      <a class="sidebar-brand" href="{% url 'recipes:dashboard' %}" title="BBS — Brewing Brain System">
        <img class="sidebar-brand-logo" src="{% static 'recipes/bbs-logo-curseur.svg' %}" alt="BBS — Brewing Brain System">
      </a>
      <button class="sidebar-toggle" id="sidebar-toggle" type="button" aria-controls="app-sidebar" aria-expanded="true" aria-label="Replier le menu" title="Replier le menu">
        <i class="bi bi-chevron-left" aria-hidden="true"></i>
      </button>
    </div>
    <nav class="sidebar-nav" aria-label="Navigation principale">
      <a class="sidebar-link{% if request.resolver_match.url_name == 'dashboard' %} active{% endif %}" href="{% url 'recipes:dashboard' %}" title="Tableau de bord"><i class="bi bi-grid-1x2" aria-hidden="true"></i><span class="sidebar-label">Tableau de bord</span></a>
      <a class="sidebar-link{% if request.resolver_match.url_name == 'list' %} active{% endif %}" href="{% url 'recipes:list' %}" title="Recettes"><i class="bi bi-journal-text" aria-hidden="true"></i><span class="sidebar-label">Recettes</span></a>
      <a class="sidebar-link{% if request.resolver_match.url_name == 'catalog' %} active{% endif %}" href="{% url 'recipes:catalog' %}" title="Stock"><i class="bi bi-box-seam" aria-hidden="true"></i><span class="sidebar-label">Stock</span></a>
      <a class="sidebar-link{% if request.resolver_match.url_name == 'brews' %} active{% endif %}" href="{% url 'recipes:brews' %}" title="Brassins"><i class="bi bi-calendar3" aria-hidden="true"></i><span class="sidebar-label">Brassins</span></a>
      <a class="sidebar-link{% if request.resolver_match.url_name == 'shopping_list' %} active{% endif %}" href="{% url 'recipes:shopping_list' %}" title="Courses"><i class="bi bi-cart3" aria-hidden="true"></i><span class="sidebar-label">Courses</span></a>
      <a class="sidebar-link{% if request.resolver_match.url_name == 'equipment_settings' %} active{% endif %}" href="{% url 'recipes:equipment_settings' %}" title="Paramètres"><i class="bi bi-gear" aria-hidden="true"></i><span class="sidebar-label">Paramètres</span></a>
    </nav>
    <div class="sidebar-nav mt-auto">
      <a class="sidebar-link{% if request.resolver_match.url_name == 'about' %} active{% endif %}" href="{% url 'recipes:about' %}" title="À propos"><i class="bi bi-info-circle" aria-hidden="true"></i><span class="sidebar-label">À propos</span></a>
      <a class="sidebar-link" href="{% url 'password_change' %}" title="Changer le mot de passe"><i class="bi bi-key" aria-hidden="true"></i><span class="sidebar-label">Mot de passe</span></a>
      <form method="post" action="{% url 'logout' %}">
        {% csrf_token %}
        <button class="sidebar-link w-100 border-0 bg-transparent text-start" type="submit" title="Déconnexion"><i class="bi bi-box-arrow-right" aria-hidden="true"></i><span class="sidebar-label">Déconnexion</span></button>
      </form>
    </div>
  </aside>
  <main class="app-main" id="main-content">
    <div class="app-content">
      {% for message in messages %}
      <div class="alert {% if 'error' in message.tags %}alert-danger{% elif 'warning' in message.tags %}alert-warning{% elif 'info' in message.tags %}alert-info{% elif 'success' in message.tags %}alert-success{% else %}alert-secondary{% endif %}" role="alert">
        {{ message }}
      </div>
      {% endfor %}
      {% block content %}{% endblock %}
    </div>
  </main>
  <style>
    :root { --sidebar-width: 15rem; --sidebar-collapsed-width: 4.75rem; }
    .app-sidebar { background: #0055aa; bottom: 0; color: #fff; display: flex; flex-direction: column; left: 0; padding: 1rem .75rem; position: fixed; top: 0; transition: width .2s ease; width: var(--sidebar-width); z-index: 1030; }
    .sidebar-header { align-items: center; display: flex; gap: .5rem; justify-content: space-between; margin-bottom: 2rem; }
    .sidebar-brand { align-items: center; color: #fff; display: flex; font-size: 1.25rem; font-weight: 600; gap: .65rem; overflow: hidden; text-decoration: none; white-space: nowrap; }
    .sidebar-brand-logo { display: block; height: 3rem; max-width: 8rem; object-fit: contain; width: 6.2rem; }
    .sidebar-toggle { background: transparent; border: 1px solid rgba(255, 255, 255, .2); border-radius: .5rem; color: #adb5bd; height: 2.25rem; min-width: 2.25rem; }
    .sidebar-toggle:hover { background: rgba(255, 255, 255, .1); color: #fff; }
    .sidebar-nav { display: flex; flex-direction: column; gap: .35rem; }
    .sidebar-link { align-items: center; border-radius: .65rem; color: #adb5bd; display: flex; gap: .8rem; padding: .75rem .8rem; text-decoration: none; transition: background-color .15s ease, color .15s ease; white-space: nowrap; }
    .sidebar-link i { font-size: 1.1rem; min-width: 1.25rem; text-align: center; }
    .sidebar-link:hover, .sidebar-link.active { background: rgba(255, 255, 255, .12); color: #fff; }
    .app-main { margin-left: var(--sidebar-width); min-height: 100vh; padding: 1.5rem; transition: margin-left .2s ease; }
    .app-content { margin-left: auto; margin-right: auto; max-width: 87.5rem; }
    .app-content:has(.table-responsive), .app-content:has(.shopping-layout) { max-width: none; }
    body.sidebar-collapsed .app-sidebar { width: var(--sidebar-collapsed-width); }
    body.sidebar-collapsed .app-main { margin-left: var(--sidebar-collapsed-width); }
    body.sidebar-collapsed .sidebar-label { display: none; }
    body.sidebar-collapsed .sidebar-brand { display: none; }
    body.sidebar-collapsed .sidebar-header { justify-content: center; }
    body.sidebar-collapsed .sidebar-toggle i { transform: rotate(180deg); }
    body.sidebar-collapsed .sidebar-link { justify-content: center; padding-left: .75rem; padding-right: .75rem; }
    @media (max-width: 767.98px) {
      .app-sidebar { width: var(--sidebar-collapsed-width); }
      .app-main { margin-left: var(--sidebar-collapsed-width); padding: 1rem .75rem; }
      .sidebar-label { display: none; }
      .sidebar-brand { display: none; }
      .sidebar-header { justify-content: center; }
      .sidebar-link { justify-content: center; padding-left: .75rem; padding-right: .75rem; }
    }
  </style>
  <script>
    (() => {
      const sidebar = document.getElementById("app-sidebar");
      const toggle = document.getElementById("sidebar-toggle");
      const storageKey = "bbrew-sidebar-collapsed";
      const setCollapsed = (collapsed) => {
        document.body.classList.toggle("sidebar-collapsed", collapsed);
        toggle.setAttribute("aria-expanded", String(!collapsed));
        toggle.setAttribute("aria-label", collapsed ? "Déployer le menu" : "Replier le menu");
        toggle.title = collapsed ? "Déployer le menu" : "Replier le menu";
      };
      const savedState = window.localStorage.getItem(storageKey);
      setCollapsed(savedState === "true");
      toggle.addEventListener("click", () => {
        const collapsed = !document.body.classList.contains("sidebar-collapsed");
        setCollapsed(collapsed);
        window.localStorage.setItem(storageKey, String(collapsed));
      });
    })();
  </script>
</body>
</html>
