<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}BBrew{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
</head>
<body class="bg-light">
  <nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container"><a class="btn btn-outline-light btn-sm" href="{% url 'recipes:list' %}">Recettes</a>
      <a class="btn btn-outline-light btn-sm" href="{% url 'recipes:catalog' %}">Stock</a>
      <a class="btn btn-outline-light btn-sm" href="{% url 'recipes:brews' %}">Brassins</a>
      <a class="btn btn-outline-light btn-sm" href="{% url 'recipes:shopping_list' %}">Courses</a>
      <a class="btn btn-outline-light btn-sm" href="{% url 'recipes:equipment_settings' %}">Paramètres</a>
      <a class="btn btn-outline-light btn-sm" href="{% url 'recipes:categories' %}">Catégories BJCP</a>
    </div>
  </nav>
  <main class="container pb-5">
    {% for message in messages %}<div class="alert alert-success">{{ message }}</div>{% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
