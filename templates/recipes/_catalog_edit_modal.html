<div class="modal-header">
  <h2 class="modal-title h5">Modifier un élément</h2>
  <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fermer"></button>
</div>
<form method="post" action="{% url 'recipes:catalog_edit' item.pk %}" data-catalog-edit-form>
  <div class="modal-body">
    {% csrf_token %}
    <p class="text-secondary small">{{ item.name }} · {{ item.get_kind_display }}</p>
    {% for field in form %}
    <div class="mb-3">
      <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
      {{ field }}
      {% for error in field.errors %}<div class="text-danger small">{{ error }}</div>{% endfor %}
    </div>
    {% endfor %}
  </div>
  <div class="modal-footer">
    <button class="btn btn-outline-secondary" type="button" data-bs-dismiss="modal">Annuler</button>
    <button class="btn btn-primary" type="submit">Enregistrer</button>
  </div>
</form>
