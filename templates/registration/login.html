{% load static %}
<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Connexion · BBS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    body { background-color: #0055aa !important; min-height: 100vh; }
    .login-card { max-width: 38rem; width: 100%; }
    .login-logo { display: block; width: min(100%, 34rem); height: auto; margin: 0 auto 1.25rem; }
    .login-card input[type="text"], .login-card input[type="password"] { display: block; width: 100%; padding: .375rem .75rem; border: 1px solid #dee2e6; border-radius: .375rem; }
  </style>
</head>
<body class="d-flex align-items-center justify-content-center p-3">
  <main class="card shadow-sm login-card">
    <div class="card-body p-4">
      <img class="login-logo" src="{% static 'recipes/bbs-logo.svg' %}" alt="BBS — Brewing Brain System">
      <p class="text-secondary text-center mb-4">Le BBS des brasseurs.</p>
      {% if form.errors %}<div class="alert alert-danger" role="alert">Nom d’utilisateur ou mot de passe incorrect.</div>{% endif %}
      <form method="post">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ next }}">
        <div class="mb-3">
          <label class="form-label" for="{{ form.username.id_for_label }}">Utilisateur</label>
          {{ form.username }}
        </div>
        <div class="mb-3">
          <label class="form-label" for="{{ form.password.id_for_label }}">Mot de passe</label>
          {{ form.password }}
        </div>
        <button class="btn btn-primary w-100" type="submit">Se connecter</button>
      </form>
    </div>
  </main>
</body>
</html>
